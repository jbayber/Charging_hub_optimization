[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "charging_hub_optimization"
version = "0.1.0"
description = "Charging hub optimization problem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "ortools==9.15.6755",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["charging_hub_optimization"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]

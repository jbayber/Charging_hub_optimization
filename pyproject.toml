[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "charging_hub_optimization"
version = "0.1.0"
description = "Charging hub optimization problem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "ortools==9.15.6755",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "charging_hub_optimization[test]",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["charging_hub_optimization"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
filterwarnings = [
    # Emitted by ortools' SWIG bindings on Python 3.12+; harmless and not ours to fix.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["tmp"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, and import sorting.
select = ["E", "F", "I"]
# Long lines are left to the formatter (it does not rewrap comments/docstrings).
ignore = ["E501"]
